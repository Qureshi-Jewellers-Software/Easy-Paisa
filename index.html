<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f7a4a">
<title>Easy Paisa Hisaab</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f3;color:#1c2b24;padding-bottom:76px}
header{background:#0f7a4a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:19px}
header small{opacity:.85;font-size:13px}
main{padding:12px;max-width:560px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:16px;margin-bottom:10px;color:#0f7a4a}
label{display:block;font-size:13px;color:#4a5a52;margin:8px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
input,select{width:100%;padding:12px;border:1px solid #cfd8d3;border-radius:10px;font-size:16px;background:#fff}
input:focus{outline:2px solid #0f7a4a;border-color:transparent}
.mic{flex:0 0 48px;height:48px;border-radius:10px;border:0;background:#e3f2ea;font-size:20px}
.mic.on{background:#e53935;color:#fff}
button.main{width:100%;padding:14px;border:0;border-radius:12px;background:#0f7a4a;color:#fff;font-size:17px;font-weight:600;margin-top:12px}
button.sec{padding:10px 12px;border:1px solid #0f7a4a;border-radius:10px;background:#fff;color:#0f7a4a;font-size:14px}
button.del{border-color:#c62828;color:#c62828}
.calc{background:#f4faf6;border-radius:10px;padding:10px;margin-top:10px;font-size:15px}
.calc b{color:#0f7a4a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f4faf6;border-radius:10px;padding:10px}
.stat span{display:block;font-size:12px;color:#4a5a52}
.stat b{font-size:18px}
.stat.big{grid-column:1/3;background:#0f7a4a;color:#fff}
.stat.big span{color:#d7efe2}
.stat.warn b{color:#c62828}
.tx{border-bottom:1px solid #eef2f0;padding:10px 0}
.tx:last-child{border:0}
.tx .top{display:flex;justify-content:space-between;font-weight:600}
.tx .sub{font-size:13px;color:#5d6d65;margin-top:3px}
.tx .acts{display:flex;gap:6px;margin-top:8px}
.tx .acts button{flex:1;padding:8px;font-size:13px}
.green{color:#0f7a4a}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #dde5e0;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;color:#5d6d65}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.act{color:#0f7a4a;font-weight:700}
.page{display:none}.page.show{display:block}
details{border-bottom:1px solid #eef2f0;padding:8px 0}
summary{font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
.empty{color:#7a8a82;text-align:center;padding:16px;font-size:14px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1c2b24;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:9}
.note{font-size:12px;color:#7a8a82;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1 id="shopName">Easy Paisa Hisaab</h1>
  <small id="todayLbl"></small>
</header>

<main>
<!-- NAYI ENTRY -->
<section class="page show" id="p-new">
  <div class="card">
    <h2>➕ Nayi Payment</h2>
    <label>Customer ka naam (zaroori nahi)</label>
    <div class="row"><input id="fName" placeholder="Jaise: Ali"><button class="mic" data-for="fName">🎤</button></div>
    <label>Receiver ka EasyPaisa number</label>
    <div class="row"><input id="fNum" type="tel" inputmode="numeric" placeholder="03xx xxxxxxx" maxlength="13"><button class="mic" data-for="fNum" data-num="1">🎤</button></div>
    <label>Kitne paise bheje (Rs)</label>
    <div class="row"><input id="fAmt" type="number" inputmode="numeric" placeholder="Jaise: 5000"><button class="mic" data-for="fAmt" data-num="1">🎤</button></div>
    <div class="row">
      <div><label>Fees li (Rs)</label><input id="fFee" type="number" inputmode="numeric"></div>
      <div><label>Bank charges (Rs)</label><input id="fBank" type="number" inputmode="numeric"></div>
    </div>
    <div class="calc" id="calcBox">Amount likhein, fees khud ban jayegi.</div>
    <button class="main" id="saveBtn">✅ Save Karein</button>
    <button class="sec" id="cancelEdit" style="display:none;width:100%;margin-top:8px">Edit chhorein</button>
  </div>
  <div class="card">
    <h2>📋 Aaj ki Payments</h2>
    <div id="todayList"></div>
  </div>
</section>

<!-- AAJ KA HISAAB -->
<section class="page" id="p-today">
  <div class="card">
    <h2>📊 Aaj Ka Hisaab</h2>
    <div class="stats" id="todayStats"></div>
  </div>
  <div class="card">
    <h2>🏦 Meezan Bank Balance</h2>
    <label>Aaj subah ka balance (Rs)</label>
    <div class="row"><input id="openBal" type="number" inputmode="numeric" placeholder="Jaise: 200000"><button class="sec" id="saveBal" style="flex:0 0 90px">Save</button></div>
    <label>Din mein bank mein paise daale (Rs)</label>
    <div class="row"><input id="addBal" type="number" inputmode="numeric" placeholder="Jaise: 50000"><button class="sec" id="saveAdd" style="flex:0 0 90px">Jama</button></div>
    <div class="calc" id="balBox"></div>
  </div>
</section>

<!-- PURANA RECORD -->
<section class="page" id="p-old">
  <div class="card">
    <h2>📅 Purana Record</h2>
    <div id="oldList"></div>
  </div>
</section>

<!-- SETTINGS -->
<section class="page" id="p-set">
  <div class="card">
    <h2>⚙️ Settings</h2>
    <label>Dukaan ka naam</label>
    <input id="sName" placeholder="Jaise: Ali EasyPaisa Point">
    <label>Har 1000 rupay par fees (Rs)</label>
    <input id="sRate" type="number" inputmode="numeric">
    <label>Kam se kam fees (Rs)</label>
    <input id="sMin" type="number" inputmode="numeric">
    <label>Meezan Bank charges har transfer par (Rs)</label>
    <input id="sBank" type="number" inputmode="numeric">
    <button class="main" id="saveSet">Settings Save Karein</button>
  </div>
  <div class="card">
    <h2>💾 Backup</h2>
    <p class="note">Data sirf is phone mein hai. Hafte mein ek baar backup file bana kar WhatsApp par khud ko bhej dein.</p>
    <div class="row" style="margin-top:10px">
      <button class="sec" id="expBtn">⬇️ Backup banayein</button>
      <button class="sec" id="impBtn">⬆️ Backup wapas layein</button>
    </div>
    <input type="file" id="impFile" accept=".json" style="display:none">
  </div>
</section>
</main>

<nav>
  <button class="act" data-p="p-new"><i>➕</i>Nayi Entry</button>
  <button data-p="p-today"><i>📊</i>Aaj Ka Hisaab</button>
  <button data-p="p-old"><i>📅</i>Purana Record</button>
  <button data-p="p-set"><i>⚙️</i>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const KEY='ep_data_v1';
const $=id=>document.getElementById(id);
const rs=n=>'Rs '+Math.round(n||0).toLocaleString('en-PK');
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const niceDay=k=>{const [y,m,d]=k.split('-');return +d+' '+MONTHS[m-1]+' '+y};
const time=ts=>new Date(ts).toLocaleTimeString('en-PK',{hour:'numeric',minute:'2-digit'});

let db={settings:{name:'',rate:20,min:20,bank:0},tx:[],bal:{}};
try{const s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Save nahi hua!')}}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200)}

let editId=null, feeTouched=false, bankTouched=false;

function calcFee(a){const s=db.settings;if(a<=0)return 0;return Math.max(num(s.min),Math.ceil(a/1000)*num(s.rate))}
function updateCalc(){
  const a=num($('fAmt').value);
  if(!feeTouched)$('fFee').value=a>0?calcFee(a):'';
  if(!bankTouched)$('fBank').value=a>0?num(db.settings.bank):'';
  const fee=num($('fFee').value),bank=num($('fBank').value);
  $('calcBox').innerHTML=a>0?`Customer se lein: <b>${rs(a+fee)}</b><br>Bank se jayega: ${rs(a+bank)}<br>Aapka profit: <b>${rs(fee-bank)}</b>`:'Amount likhein, fees khud ban jayegi.';
}
$('fAmt').addEventListener('input',updateCalc);
$('fFee').addEventListener('input',()=>{feeTouched=true;updateCalc()});
$('fBank').addEventListener('input',()=>{bankTouched=true;updateCalc()});

function resetForm(){['fName','fNum','fAmt','fFee','fBank'].forEach(i=>$(i).value='');feeTouched=bankTouched=false;editId=null;$('saveBtn').textContent='✅ Save Karein';$('cancelEdit').style.display='none';updateCalc()}
$('cancelEdit').onclick=resetForm;

$('saveBtn').onclick=()=>{
  const a=num($('fAmt').value);
  const nr=$('fNum').value.replace(/\D/g,'');
  if(a<=0)return toast('Amount likhein');
  if(nr.length<10)return toast('Sahi EasyPaisa number likhein');
  const fee=num($('fFee').value),bank=num($('fBank').value);
  if(editId){
    const t=db.tx.find(x=>x.id===editId);
    Object.assign(t,{name:$('fName').value.trim(),number:nr,amount:a,fee,bank});
    toast('Entry badal di');
  }else{
    db.tx.push({id:Date.now()+''+Math.floor(Math.random()*1000),ts:Date.now(),day:dayKey(),name:$('fName').value.trim(),number:nr,amount:a,fee,bank});
    toast('Save ho gaya ✅');
  }
  save();resetForm();renderAll();
};

function txHtml(t,withActs){
  return `<div class="tx"><div class="top"><span>${esc(t.name)||'Customer'} → ${t.number}</span><span>${rs(t.amount)}</span></div>
  <div class="sub">${time(t.ts)} · Fees ${rs(t.fee)} · Bank ${rs(t.bank)} · <b class="green">Profit ${rs(t.fee-t.bank)}</b></div>
  ${withActs?`<div class="acts"><button class="sec" onclick="wa('${t.id}')">📲 WhatsApp</button><button class="sec" onclick="editTx('${t.id}')">✏️ Edit</button><button class="sec del" onclick="delTx('${t.id}')">🗑️ Delete</button></div>`:''}</div>`;
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

window.editTx=id=>{const t=db.tx.find(x=>x.id===id);if(!t)return;go('p-new');editId=id;feeTouched=bankTouched=true;
  $('fName').value=t.name;$('fNum').value=t.number;$('fAmt').value=t.amount;$('fFee').value=t.fee;$('fBank').value=t.bank;
  $('saveBtn').textContent='💾 Badlav Save Karein';$('cancelEdit').style.display='block';updateCalc();scrollTo(0,0)};
window.delTx=id=>{if(!confirm('Yeh entry delete karni hai?'))return;db.tx=db.tx.filter(x=>x.id!==id);save();renderAll();toast('Delete ho gayi')};
window.wa=id=>{const t=db.tx.find(x=>x.id===id);if(!t)return;
  const shop=db.settings.name||'Easy Paisa';
  const msg=`*${shop}*\nPayment Slip\nTareekh: ${niceDay(t.day)} ${time(t.ts)}\nReceiver: ${t.number}\nAmount: ${rs(t.amount)}\nFees: ${rs(t.fee)}\nTotal: ${rs(t.amount+t.fee)}\nShukriya!`;
  open('https://wa.me/?text='+encodeURIComponent(msg),'_blank')};

function sums(list){return list.reduce((s,t)=>{s.amt+=t.amount;s.fee+=t.fee;s.bank+=t.bank;s.n++;return s},{amt:0,fee:0,bank:0,n:0})}

function renderToday(){
  const k=dayKey(),list=db.tx.filter(t=>t.day===k).sort((a,b)=>b.ts-a.ts);
  $('todayList').innerHTML=list.length?list.map(t=>txHtml(t,true)).join(''):'<div class="empty">Aaj abhi koi payment nahi.</div>';
  const s=sums(list);
  $('todayStats').innerHTML=`
   <div class="stat big"><span>Aaj ka Profit</span><b>${rs(s.fee-s.bank)}</b></div>
   <div class="stat"><span>Kitni payments</span><b>${s.n}</b></div>
   <div class="stat"><span>Total bheja</span><b>${rs(s.amt)}</b></div>
   <div class="stat"><span>Total fees li</span><b>${rs(s.fee)}</b></div>
   <div class="stat"><span>Bank charges</span><b>${rs(s.bank)}</b></div>
   <div class="stat" style="grid-column:1/3"><span>Customers se cash mila (amount + fees)</span><b>${rs(s.amt+s.fee)}</b></div>`;
  const b=db.bal[k]||{open:null,add:0};
  $('openBal').value=b.open??'';
  if(b.open==null){$('balBox').innerHTML='Subah ka balance likh kar Save dabayein.';}
  else{const left=num(b.open)+num(b.add)-s.amt-s.bank;
    $('balBox').innerHTML=`Subah: ${rs(b.open)}<br>Jama kiye: ${rs(b.add)}<br>Bheje + charges: ${rs(s.amt+s.bank)}<br>Ab bank mein hone chahiye: <b style="color:${left<0?'#c62828':'#0f7a4a'}">${rs(left)}</b>`}
}
$('saveBal').onclick=()=>{const k=dayKey();db.bal[k]=db.bal[k]||{add:0};db.bal[k].open=num($('openBal').value);save();renderToday();toast('Balance save')};
$('saveAdd').onclick=()=>{const k=dayKey(),v=num($('addBal').value);if(v<=0)return toast('Raqam likhein');db.bal[k]=db.bal[k]||{open:null,add:0};db.bal[k].add=num(db.bal[k].add)+v;$('addBal').value='';save();renderToday();toast('Jama ho gaya')};

function renderOld(){
  const months={};
  db.tx.forEach(t=>{const m=t.day.slice(0,7);(months[m]=months[m]||{})[t.day]=(months[m][t.day]||[]).concat(t)});
  const mk=Object.keys(months).sort().reverse();
  if(!mk.length){$('oldList').innerHTML='<div class="empty">Abhi koi record nahi.</div>';return}
  $('oldList').innerHTML=mk.map(m=>{
    const days=months[m],all=Object.values(days).flat(),s=sums(all),[y,mm]=m.split('-');
    return `<details><summary><span>${MONTHS[mm-1]} ${y}</span><span class="green">${rs(s.fee-s.bank)}</span></summary>
     <div class="note">${s.n} payments · Bheja ${rs(s.amt)} · Fees ${rs(s.fee)}</div>
     ${Object.keys(days).sort().reverse().map(d=>{const ds=sums(days[d]);
       return `<details style="margin-left:10px"><summary><span>${niceDay(d)} (${ds.n})</span><span class="green">${rs(ds.fee-ds.bank)}</span></summary>
       ${days[d].sort((a,b)=>b.ts-a.ts).map(t=>txHtml(t,true)).join('')}</details>`}).join('')}
    </details>`}).join('');
}

function renderSettings(){const s=db.settings;$('sName').value=s.name;$('sRate').value=s.rate;$('sMin').value=s.min;$('sBank').value=s.bank;$('shopName').textContent=s.name||'Easy Paisa Hisaab'}
$('saveSet').onclick=()=>{db.settings={name:$('sName').value.trim(),rate:num($('sRate').value),min:num($('sMin').value),bank:num($('sBank').value)};save();renderAll();toast('Settings save ✅')};

$('expBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='easypaisa-backup-'+dayKey()+'.json';a.click()};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx)throw 0;if(!confirm('Purana data is backup se badal jayega. Theek hai?'))return;db=Object.assign({settings:{name:'',rate:20,min:20,bank:0},tx:[],bal:{}},d);save();renderAll();toast('Backup wapas aa gaya')}catch(x){toast('Ghalat file')}};r.readAsText(f)};

function go(p){document.querySelectorAll('.page').forEach(s=>s.classList.toggle('show',s.id===p));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('act',b.dataset.p===p));if(p==='p-old')renderOld();if(p==='p-today')renderToday()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));

// Voice
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const urduNums={'ek':1,'do':2,'teen':3,'char':4,'chaar':4,'panch':5,'paanch':5,'che':6,'chhe':6,'saat':7,'aath':8,'nau':9,'das':10,'hazar':1000,'hazaar':1000,'sau':100,'lakh':100000};
document.querySelectorAll('.mic').forEach(btn=>btn.onclick=()=>{
  if(!SR)return toast('Is phone mein voice nahi chalti');
  const r=new SR();r.lang=btn.dataset.num?'en-IN':'ur-PK';r.interimResults=false;
  btn.classList.add('on');r.start();
  r.onresult=e=>{let t=e.results[0][0].transcript;const inp=$(btn.dataset.for);
    if(btn.dataset.num){
      let v=t.toLowerCase().replace(/,/g,'');
      if(btn.dataset.for==='fAmt'){
        let m=v.match(/(\d+(?:\.\d+)?)\s*(thousand|hazar|hazaar|k\b|lakh|lac)?/);
        if(m){let n=parseFloat(m[1]);if(m[2])n*=/lakh|lac/.test(m[2])?100000:1000;inp.value=Math.round(n)}
      }else inp.value=v.replace(/\D/g,'');
    }else inp.value=t;
    inp.dispatchEvent(new Event('input'))};
  r.onend=()=>btn.classList.remove('on');r.onerror=()=>{btn.classList.remove('on');toast('Awaaz samajh nahi aayi')};
});

function renderAll(){renderSettings();renderToday();if($('p-old').classList.contains('show'))renderOld()}
$('todayLbl').textContent='Aaj: '+niceDay(dayKey());
renderAll();updateCalc();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
